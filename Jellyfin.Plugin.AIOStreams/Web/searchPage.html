<!DOCTYPE html>
<html>
<head>
    <title>Jellyio Streams</title>
    <style>
        body { background: transparent; }
        .jellyio-section { margin: 1.6em 0 0.5em; font-weight: 700; font-size: 1.1em; }
        .jellyio-serverline { color: #999; font-size: 0.92em; margin-top: 0.3em; }
        .jellyio-banner { margin: 1em 0; padding: 0.7em 1em; border-radius: 6px; border: 1px solid #555; background: #151515; color: #ddd; }
        .jellyio-banner.warn { border-color: #8a6d3b; background: #2a2415; color: #f0d9a8; }
        .jellyio-banner.error { border-color: #a94442; background: #2a1515; color: #f0b0b0; }
        .jellyio-banner p { margin: 0 0 0.4em; }
        .jellyio-banner p:last-child { margin-bottom: 0; }
        .jellyio-banner button { margin-top: 0.6em; padding: 0.4em 1.1em; cursor: pointer; }
        .jellyio-field { margin: 0.8em 0; }
        .jellyio-field label { display: block; margin-bottom: 0.25em; font-weight: 600; }
        .jellyio-field input[type="text"],
        .jellyio-field select {
            width: 100%; max-width: 36em; padding: 0.4em 0.6em;
            border: 1px solid #555; border-radius: 4px; background: #151515; color: #ddd;
        }
        .jellyio-hint { color: #999; font-size: 0.9em; margin-top: 0.2em; }
        .jellyio-actions button, .jellyio-card button { margin: 0.3em 0.6em 0.3em 0; padding: 0.5em 1.1em; cursor: pointer; }
        .jellyio-searchrow { display: flex; flex-wrap: wrap; gap: 0.6em; align-items: flex-end; }
        .jellyio-searchrow .jellyio-field { margin: 0; }
        .jellyio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11em, 1fr)); gap: 1em; margin-top: 1em; }
        .jellyio-card { border: 1px solid #333; border-radius: 6px; overflow: hidden; background: #101010; display: flex; flex-direction: column; }
        .jellyio-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #1c1c1c; }
        .jellyio-cardBody { padding: 0.5em 0.6em 0.6em; display: flex; flex-direction: column; gap: 0.3em; flex: 1; }
        .jellyio-cardBody strong { font-size: 0.95em; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .jellyio-cardBody span { color: #999; font-size: 0.85em; }
        .jellyio-cardBody button { margin: auto 0 0; width: 100%; }
        .jellyio-added { color: #7fba7f; font-size: 0.9em; padding: 0.3em 0; }
        .jellyio-msg { color: #bbb; font-size: 0.92em; margin-top: 0.6em; white-space: pre-wrap; }
        .jellyio-error { color: #e08c8c; font-size: 0.92em; margin-top: 0.6em; white-space: pre-wrap; }
        .jellyio-librarylist { margin-top: 0.6em; }
        .jellyio-libraryrow { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4em; padding: 0.25em 0; border-bottom: 1px solid #222; }
        .jellyio-libraryrow strong { font-weight: 600; }
        .jellyio-libraryrow span { color: #999; font-size: 0.9em; }
        .jellyio-libraryrow button { margin: 0 0 0 auto; padding: 0.25em 0.9em; cursor: pointer; }
        .jellyio-picker { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .jellyio-pickerBox { width: min(30em, 90vw); max-height: 75vh; overflow: auto; background: #151515; border: 1px solid #555; border-radius: 6px; padding: 1em; }
        .jellyio-pickerBox h2 { margin: 0 0 0.6em; font-size: 1.05em; }
        .jellyio-pickerRow { display: flex; align-items: center; gap: 0.6em; padding: 0.35em 0; border-bottom: 1px solid #222; }
        .jellyio-pickerRow span { flex: 1; color: #bbb; font-size: 0.92em; }
        .jellyio-pickerRow button { padding: 0.3em 1em; cursor: pointer; }
        .jellyio-pickerClose { margin-top: 0.8em; text-align: right; }
        .jellyio-pickerClose button { padding: 0.3em 1em; cursor: pointer; }
    </style>
</head>
<body>
    <div id="JellyioSearchPage" data-role="page" class="page type-interior JellyioSearchPage">
        <div class="content-primary" style="max-width:70em; padding:1em;">
            <h1 style="margin:0;">Jellyio Streams</h1>
            <div class="jellyio-serverline" id="serverLine"></div>

            <div id="setupBanner"></div>

            <div class="jellyio-search" id="searchSection" style="display:none;">
                <div class="jellyio-section">Find a title</div>
                <div class="jellyio-searchrow">
                    <div class="jellyio-field">
                        <label>Type</label>
                        <select class="fldSearchType">
                            <option value="movie">Movie</option>
                            <option value="series">Series</option>
                        </select>
                    </div>
                    <div class="jellyio-field" style="flex:1 1 20em;">
                        <label>Search AIOStreams</label>
                        <input type="text" class="fldSearchTerm" placeholder="e.g. Dune" />
                    </div>
                    <button type="button" class="btnSearch" style="padding:0.5em 1.1em; cursor:pointer;">Search</button>
                </div>
                <div class="jellyio-msg" id="searchMsg"></div>
                <div class="jellyio-grid" id="searchResults"></div>
            </div>

            <div class="jellyio-section">In your library</div>
            <div class="jellyio-actions">
                <button type="button" class="btnRefresh" style="padding:0.5em 1.1em; cursor:pointer;">Refresh</button>
            </div>
            <div class="jellyio-msg" id="libraryBox"></div>
        </div>

        <script type="text/javascript">
            (function () {
                var PLUGIN_ID = "3a9f7c1e-5b6d-4e8f-9c2a-1d4b5e6f7a8b";
                var PAGE_SELECTOR = ".JellyioSearchPage";

                function currentPage() {
                    var own = document.currentScript;
                    var scoped = own && own.closest ? own.closest(PAGE_SELECTOR) : null;
                    if (scoped) { return scoped; }
                    var all = document.querySelectorAll(PAGE_SELECTOR);
                    return all.length ? all[all.length - 1] : null;
                }

                function pick(obj, name) {
                    if (!obj || typeof obj !== "object") { return undefined; }
                    if (Object.prototype.hasOwnProperty.call(obj, name)) { return obj[name]; }
                    var lower = String(name).toLowerCase();
                    for (var key in obj) {
                        if (Object.prototype.hasOwnProperty.call(obj, key) && key.toLowerCase() === lower) {
                            return obj[key];
                        }
                    }
                    return undefined;
                }

                function escapeHtml(value) {
                    return String(value == null ? "" : value)
                        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
                }

                function loading(show) {
                    if (!window.Dashboard) { return; }
                    if (show && Dashboard.showLoadingMsg) { Dashboard.showLoadingMsg(); }
                    if (!show && Dashboard.hideLoadingMsg) { Dashboard.hideLoadingMsg(); }
                }

                function Controller(page) {
                    this.page = page;
                    this.added = {};
                    this.ok = false;
                    this.qualityPicker = false;
                    this.autoSearch = null;
                }

                Controller.prototype.el = function (selector) {
                    return this.page.querySelector(selector);
                };

                Controller.prototype.setText = function (selector, text) {
                    var el = this.el(selector);
                    if (el) { el.textContent = text; }
                };

                Controller.prototype.showError = function (message) {
                    this.setText("#searchMsg", "ERROR: " + message);
                    try { console.error("[Jellyio Streams] " + message); } catch (e) { /* ignore */ }
                };

                Controller.prototype.showHttpError = function (context, err) {
                    var self = this;
                    if (err && typeof err.status === "number") {
                        var base = context + " HTTP " + err.status + (err.url ? " (" + err.url + ")" : "");
                        if (typeof err.text === "function") {
                            err.text().then(function (body) {
                                self.showError(base + (body ? " - " + body.slice(0, 400) : ""));
                            }).catch(function () { self.showError(base); });
                        } else {
                            self.showError(base);
                        }
                        return;
                    }
                    this.showError(context + " " + (err && err.message ? err.message : err));
                };

                Controller.prototype.status = function () {
                    var self = this;
                    var banner = this.el("#setupBanner");
                    var section = this.el("#searchSection");
                    ApiClient.getJSON(ApiClient.getUrl("AIOStreams/Status")).then(function (status) {
                        var folderState = pick(status, "FolderState") || "";
                        var addonConfigured = pick(status, "AddonUrlConfigured") === true;
                        var version = pick(status, "PluginVersion");
                        var addonName = pick(status, "AddonName");
                        self.ok = folderState === "Ok" && addonConfigured;
                        self.qualityPicker = pick(status, "QualityPickerAtAdd") === true;

                        var line = "plugin v" + (version || "?") + " · addon: " +
                            (addonName ? addonName : "(not configured)") + " · folder: " + (folderState || "?");
                        self.setText("#serverLine", line);

                        var problems = [];
                        if (folderState === "Missing") {
                            problems.push({ cls: "warn", html: "<p>The required /data/stream folder is missing.</p>" });
                        } else if (folderState === "NotDirectory" || folderState === "NotWritable") {
                            problems.push({ cls: "error", html: "<p>The required /data/stream folder is not usable (state: " + escapeHtml(folderState) + ").</p>" });
                        }
                        if (!addonConfigured) {
                            problems.push({ cls: "warn", html: "<p>Open the plugin settings and enter your AIOStreams URL first. " +
                                '<a href="configurationpage?name=' + encodeURIComponent("Jellyio Streams") + '">Open settings</a></p>' });
                        }

                        if (problems.length > 0) {
                            banner.innerHTML = problems.map(function (p) {
                                return '<div class="jellyio-banner ' + p.cls + '">' + p.html + "</div>";
                            }).join("");
                            if (folderState === "Missing") {
                                var create = document.createElement("button");
                                create.type = "button";
                                create.textContent = "Create now";
                                create.addEventListener("click", function () { self.createFolder(); });
                                banner.lastChild.appendChild(create);
                            }
                            section.style.display = "none";
                        } else {
                            banner.innerHTML = "";
                            section.style.display = "";
                            self.library();
                        }

                        if (self.ok && self.autoSearch) {
                            self.autoSearch = null;
                            self.search();
                        }
                    }).catch(function (err) {
                        self.showHttpError("Failed to read status:", err);
                    });
                };

                Controller.prototype.createFolder = function () {
                    var self = this;
                    loading(true);
                    ApiClient.ajax({
                        type: "POST",
                        url: ApiClient.getUrl("AIOStreams/CreateFolder"),
                        contentType: "application/json",
                        dataType: "json"
                    }).then(function () {
                        loading(false);
                        self.status();
                    }).catch(function (err) {
                        loading(false);
                        self.showHttpError("Failed to create the stream folder:", err);
                    });
                };

                Controller.prototype.search = function () {
                    var self = this;
                    if (!self.ok) { return; }
                    var term = this.el(".fldSearchTerm").value.trim();
                    var type = this.el(".fldSearchType").value;
                    if (!term) { return; }

                    this.setText("#searchMsg", "Searching…");
                    this.el("#searchResults").innerHTML = "";
                    loading(true);

                    ApiClient.getJSON(ApiClient.getUrl("AIOStreams/Search", { term: term, type: type, limit: 24 })).then(function (results) {
                        loading(false);
                        var container = self.el("#searchResults");
                        var list = results || [];

                        if (list.length === 0) {
                            self.setText("#searchMsg", "No results for \"" + term + "\".");
                            return;
                        }

                        self.setText("#searchMsg", list.length + " result(s) for \"" + term + "\".");
                        container.innerHTML = list.map(function (item) {
                            var id = pick(item, "Id");
                            var name = pick(item, "Name");
                            var poster = pick(item, "Poster");
                            var release = pick(item, "ReleaseInfo") || "";
                            var already = self.added[id];
                            var button = already
                                ? '<div class="jellyio-added">Added</div>'
                                : '<button type="button" data-id="' + escapeHtml(id) +
                                    '" data-name="' + escapeHtml(name) +
                                    '" data-type="' + escapeHtml(pick(item, "Type") || type) +
                                    '" data-release="' + escapeHtml(release) + '">Add</button>';
                            return '<div class="jellyio-card">' +
                                (poster ? '<img src="' + escapeHtml(poster) + '" loading="lazy" />' : "") +
                                '<div class="jellyio-cardBody">' +
                                "<strong>" + escapeHtml(name) + "</strong>" +
                                "<span>" + escapeHtml(release || type) + "</span>" +
                                button +
                                "</div></div>";
                        }).join("");

                        container.querySelectorAll("button[data-id]").forEach(function (btn) {
                            btn.addEventListener("click", function () {
                                if (self.qualityPicker) {
                                    self.openPicker(btn);
                                } else {
                                    self.add(btn.getAttribute("data-id"), btn.getAttribute("data-type") || "movie",
                                        btn.getAttribute("data-name"), btn.getAttribute("data-release"), null, btn);
                                }
                            });
                        });
                    }).catch(function (err) {
                        loading(false);
                        self.showHttpError("Search failed:", err);
                    });
                };

                Controller.prototype.openPicker = function (btn) {
                    var self = this;
                    var id = btn.getAttribute("data-id");
                    var type = btn.getAttribute("data-type") || "movie";
                    var name = btn.getAttribute("data-name");
                    var release = btn.getAttribute("data-release");
                    loading(true);

                    ApiClient.getJSON(ApiClient.getUrl("AIOStreams/Streams", { type: type, id: id })).then(function (streams) {
                        loading(false);
                        var list = streams || [];

                        var overlay = document.createElement("div");
                        overlay.className = "jellyio-picker";
                        overlay.setAttribute("role", "dialog");
                        overlay.setAttribute("aria-label", "Choose a stream for " + (name || id));

                        var box = document.createElement("div");
                        box.className = "jellyio-pickerBox";

                        var title = document.createElement("h2");
                        title.textContent = "Choose a stream";
                        box.appendChild(title);

                        function addRow(label, quality) {
                            var row = document.createElement("div");
                            row.className = "jellyio-pickerRow";
                            var span = document.createElement("span");
                            span.textContent = label;
                            row.appendChild(span);
                            var rowBtn = document.createElement("button");
                            rowBtn.type = "button";
                            rowBtn.textContent = "Add";
                            rowBtn.addEventListener("click", function () {
                                close();
                                self.add(id, type, name, release, quality, rowBtn);
                            });
                            row.appendChild(rowBtn);
                            box.appendChild(row);
                        }

                        if (list.length === 0) {
                            var hint = document.createElement("div");
                            hint.className = "jellyio-hint";
                            hint.textContent = "No streams were found — the addon may have no playable sources for this title.";
                            box.appendChild(hint);
                        } else {
                            list.forEach(function (stream) {
                                addRow(pick(stream, "Label") || "Stream", pick(stream, "Label") || "");
                            });
                        }
                        addRow("Best (auto)", null);

                        var closeRow = document.createElement("div");
                        closeRow.className = "jellyio-pickerClose";
                        var closeBtn = document.createElement("button");
                        closeBtn.type = "button";
                        closeBtn.textContent = "Cancel";
                        closeBtn.addEventListener("click", close);
                        closeRow.appendChild(closeBtn);
                        box.appendChild(closeRow);

                        function close() {
                            document.removeEventListener("keydown", onKey);
                            if (overlay.parentNode) { overlay.parentNode.removeChild(overlay); }
                        }

                        function onKey(e) {
                            if (e.key === "Escape") { close(); }
                        }

                        overlay.addEventListener("click", function (e) {
                            if (e.target === overlay) { close(); }
                        });
                        document.addEventListener("keydown", onKey);

                        overlay.appendChild(box);
                        document.body.appendChild(overlay);
                        closeBtn.focus();
                    }).catch(function (err) {
                        loading(false);
                        self.showHttpError("Failed to load streams:", err);
                    });
                };

                Controller.prototype.add = function (id, type, name, release, quality, btn) {
                    var self = this;
                    if (btn) {
                        btn.disabled = true;
                        btn.textContent = "Adding…";
                    }
                    loading(true);

                    ApiClient.ajax({
                        type: "POST",
                        url: ApiClient.getUrl("AIOStreams/Add"),
                        data: JSON.stringify({
                            type: type || "movie",
                            id: id,
                            name: name,
                            releaseInfo: release,
                            quality: quality || null
                        }),
                        contentType: "application/json",
                        dataType: "json"
                    }).then(function () {
                        loading(false);
                        self.added[id] = true;
                        if (btn) {
                            btn.disabled = false;
                            btn.textContent = "Added";
                            btn.setAttribute("disabled", "disabled");
                        }
                        self.setText("#searchMsg", "Added — Jellyfin is scanning now.");
                        self.library();
                        self.status();
                    }).catch(function (err) {
                        loading(false);
                        if (btn) {
                            btn.disabled = false;
                            btn.textContent = "Add";
                        }
                        self.showHttpError("Add failed:", err);
                    });
                };

                Controller.prototype.remove = function (btn) {
                    var self = this;
                    var title = btn.getAttribute("data-title");
                    if (!title) { return; }
                    if (!window.confirm("Remove \"" + title + "\" from your library?")) { return; }

                    loading(true);
                    ApiClient.ajax({
                        type: "POST",
                        url: ApiClient.getUrl("AIOStreams/Remove"),
                        data: JSON.stringify({
                            type: btn.getAttribute("data-type") || "movie",
                            title: title,
                            year: btn.getAttribute("data-year") || null
                        }),
                        contentType: "application/json",
                        dataType: "json"
                    }).then(function () {
                        loading(false);
                        self.library();
                        self.status();
                    }).catch(function (err) {
                        loading(false);
                        self.showHttpError("Remove failed:", err);
                    });
                };

                Controller.prototype.library = function () {
                    var self = this;
                    ApiClient.getJSON(ApiClient.getUrl("AIOStreams/Library")).then(function (data) {
                        var titles = pick(data, "Titles") || [];
                        var root = pick(data, "RootPath") || "";
                        var box = self.el("#libraryBox");

                        if (titles.length === 0) {
                            box.innerHTML = '<div class="jellyio-hint">Nothing in the library yet — search above and press Add.</div>';
                            return;
                        }

                        var html = '<div class="jellyio-librarylist">';
                        titles.forEach(function (t) {
                            var name = pick(t, "Name") || "";
                            var year = pick(t, "Year") || "";
                            var type = pick(t, "Type") || "movie";
                            html += '<div class="jellyio-libraryrow">' +
                                "<strong>" + escapeHtml(name) + "</strong>" +
                                (year ? "<span>" + escapeHtml(year) + "</span>" : "") +
                                "<span>" + escapeHtml(type) + "</span>" +
                                '<button type="button" data-title="' + escapeHtml(name) +
                                    '" data-year="' + escapeHtml(year) +
                                    '" data-type="' + escapeHtml(type) + '">Remove</button>' +
                                "</div>";
                        });
                        html += "</div>";
                        if (root) { html += '<div class="jellyio-hint">Library folder: ' + escapeHtml(root) + "</div>"; }
                        box.innerHTML = html;

                        box.querySelectorAll("button[data-title]").forEach(function (btn) {
                            btn.addEventListener("click", function () { self.remove(btn); });
                        });
                    }).catch(function (err) {
                        self.showHttpError("Failed to read the library:", err);
                    });
                };

                Controller.prototype.prefillFromUrl = function () {
                    var params = {};
                    var sources = [window.location.hash, window.location.search];
                    for (var i = 0; i < sources.length; i++) {
                        var source = sources[i];
                        var q = source.indexOf("?");
                        if (q < 0) { continue; }
                        var parts = source.slice(q + 1).split("&");
                        for (var j = 0; j < parts.length; j++) {
                            var pair = parts[j].split("=");
                            if (!pair[0]) { continue; }
                            var key = decodeURIComponent(pair[0].replace(/\+/g, " "));
                            var value = pair.length > 1 ? decodeURIComponent(pair.slice(1).join("=").replace(/\+/g, " ")) : "";
                            if (key) { params[key] = value; }
                        }
                    }

                    var query = params.query;
                    var type = params.type;
                    if (type === "movie" || type === "series") {
                        this.el(".fldSearchType").value = type;
                    }
                    if (query) {
                        this.el(".fldSearchTerm").value = query;
                        this.autoSearch = query;
                    }
                };

                Controller.prototype.bind = function () {
                    var self = this;
                    this.el(".btnSearch").addEventListener("click", function () { self.search(); });
                    this.el(".btnRefresh").addEventListener("click", function () { self.library(); });
                    this.el(".fldSearchTerm").addEventListener("keypress", function (e) {
                        if (e.key === "Enter") { self.search(); }
                    });
                };

                function init(page) {
                    if (!page || page.getAttribute("data-jellyio-init") === "1") { return; }
                    page.setAttribute("data-jellyio-init", "1");

                    var controller = new Controller(page);
                    controller.bind();
                    controller.prefillFromUrl();
                    controller.status();
                }

                init(currentPage());
                document.addEventListener("pageshow", function (e) {
                    var target = e.target;
                    if (target && target.classList && target.classList.contains("JellyioSearchPage")) {
                        init(target);
                    } else {
                        init(currentPage());
                    }
                });
            })();
        </script>
    </div>
</body>
</html>
